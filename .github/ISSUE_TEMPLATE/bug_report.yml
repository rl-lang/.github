name: Bug report
description: Something in RL behaves wrong
labels: [bug]
body:
  - type: input
    id: version
    attributes:
      label: RL version
      description: Output of `rl --version`
      placeholder: 2.2.1
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - interpreter (rl run)
        - type checker (rl check)
        - test runner (rl test)
        - transpiler (rlt)
        - formatter (rl format)
        - REPL
        - LSP / editor
        - stdlib
        - packaging / install
        - docs
        - other
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Smallest reproducing file
      description: Paste the shortest .rl source that shows the bug
      render: rl
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: What happened, including full error text
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What should have happened
    validations:
      required: true
